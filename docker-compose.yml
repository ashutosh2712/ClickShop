version: "3.9"

services:
  db:
    image: mongo
    container_name: ecommerce-mongo-db
    restart: always
    ports:
      - 27018:27017
    volumes:
      - mongo_ecommerce_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Mongo1234
      MONGO_INITDB_DATABASE: ecommerce

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecommerce-node-backend
    restart: always
    volumes:
      - ./server:/app
      #- /app/node_modules
    ports:
      - 3003:3000
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://root:Mongo1234@db:27018/ecommerce?authSource=admin
    command: npm start

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecommerce-react-frontend
    restart: always
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - 5174:5173
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mongo_ecommerce_data:
